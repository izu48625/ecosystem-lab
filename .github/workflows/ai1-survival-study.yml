name: AI1 survival strategy paired verification
on:
  push:
    branches:
      - experiment/ai1-survival-balanced-20261119
    paths:
      - '.github/workflows/ai1-survival-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shard:
    name: "${{ matrix.stage }}-${{ matrix.offset }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {stage: discovery, offset: 0, base: 20270001}
          - {stage: discovery, offset: 25, base: 20270001}
          - {stage: discovery, offset: 50, base: 20270001}
          - {stage: discovery, offset: 75, base: 20270001}
          - {stage: holdout, offset: 0, base: 20281001}
          - {stage: holdout, offset: 25, base: 20281001}
          - {stage: holdout, offset: 50, base: 20281001}
          - {stage: holdout, offset: 75, base: 20281001}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compute a fixed seed shard (Normal, released AI1, six candidates, and mutation-off)
        run: |
          mkdir -p benchmark-shards
          node tests/ai1-survival-study.js ${{ matrix.offset }} 25 ${{ matrix.base }} normal,baseline,alert,multi,wall,combo,budget,adaptive,baselineClone > benchmark-shards/${{ matrix.stage }}-${{ matrix.offset }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.stage }}-${{ matrix.offset }}
          path: benchmark-shards/
          if-no-files-found: error
  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: benchmark-shards
          merge-multiple: true
      - run: node tests/ai1-survival-aggregate.js
      - uses: actions/upload-artifact@v4
        with:
          name: ai1-survival-200-seed-report
          path: reports/ai1-survival-output/
          if-no-files-found: error
