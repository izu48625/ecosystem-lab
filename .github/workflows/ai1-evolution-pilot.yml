name: AI1 evolution common garden — pilot
on:
  push:
    branches:
      - research/ai1-evolution-common-garden-20261119
    paths:
      - '.github/workflows/ai1-evolution-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify common-garden seed with all three inheritance controls
        run: node tests/ai1-evolution-study.js 0 1 20321001
      - uses: actions/upload-artifact@v4
        with:
          name: ai1-evolution-pilot
          path: reports/ai1-evolution-output/
          if-no-files-found: error
