name: AI2 ecology-selected neural heredity pilot
on:
  push:
    branches:
      - research/ai2-ecological-selection-20261123
    paths:
      - '.github/workflows/ai2-eco-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    name: "pilot-${{ matrix.model }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model: [baseline, ecoMate, ecoMateWide, ecoMateHunger]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify ecology-selected heredity with three genetic controls
        run: node tests/ai2-eco-selection-study.js 0 1 20560001 ${{ matrix.model }}
      - uses: actions/upload-artifact@v4
        with:
          name: ai2-eco-pilot-${{ matrix.model }}
          path: reports/ai2-eco-selection-raw/${{ matrix.model }}/
          if-no-files-found: error
