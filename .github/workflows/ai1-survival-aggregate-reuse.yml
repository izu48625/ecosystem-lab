name: AI1 survival aggregate preserved 200-seed samples
on:
  push:
    branches:
      - experiment/ai1-survival-balanced-20261119
    paths:
      - '.github/workflows/ai1-survival-aggregate-reuse.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          run-id: 44397335424
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: shard-*
          path: benchmark-shards
          merge-multiple: true
      - name: Aggregate preserved discovery and holdout outputs
        run: node tests/ai1-survival-aggregate.js
      - uses: actions/upload-artifact@v4
        with:
          name: ai1-survival-200-seed-reprocessed
          path: reports/ai1-survival-output/
          if-no-files-found: error
