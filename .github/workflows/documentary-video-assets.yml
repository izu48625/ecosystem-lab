name: Documentary data and Japanese voiceover production
on:
  push:
    branches:
      - production/documentary-video-20261128
    paths:
      - '.github/workflows/documentary-video-assets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Export 3 genuine simulations and 30 paired seeds
        run: node tools/export-documentary-data.js
      - name: Create Japanese narration audio
        run: |
          python -m pip install gTTS mutagen
          python tools/voice-documentary.py
      - name: Upload data, 3 actual motion archives, 30 MP3 voice clips
        uses: actions/upload-artifact@v4
        with:
          name: ECOSYSTEM-LAB-documentary-source-and-voice
          path: |
            video-production/*.json
            video-production/*.json.gz
            video-production/*.csv
            video-production/voice/*.mp3
          if-no-files-found: error
          retention-days: 30
