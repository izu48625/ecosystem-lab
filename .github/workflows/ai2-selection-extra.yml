name: AI2 founder genetic shift from preserved 100-seed dataset
on:
  push:
    branches:
      - research/ai2-individual-selection-gradient-20261123
    paths:
      - '.github/workflows/ai2-selection-extra.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          run-id: 45116781714
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: founder-selection-*
          path: reports/ai2-selection-gradient-raw/
          merge-multiple: true
      - name: Quantify gene-frequency direction, drift and lineage surviving seed bootstrap CIs
        run: node tests/ai2-selection-mechanism-extra.js
      - uses: actions/upload-artifact@v4
        with:
          name: ai2-founder-selection-gene-shift-refined
          path: reports/ai2-selection-gradient-extra/
          if-no-files-found: error
