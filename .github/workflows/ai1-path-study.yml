name: AI1 green grazing along traveled path study
on:
  push:
    branches:
      - experiment/ai1-survival-balanced-20261119
    paths:
      - '.github/workflows/ai1-path-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shard:
    name: "${{ matrix.stage }}-${{ matrix.offset }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - {stage: discovery, offset: 0, base: 20294001}
          - {stage: discovery, offset: 25, base: 20294001}
          - {stage: discovery, offset: 50, base: 20294001}
          - {stage: discovery, offset: 75, base: 20294001}
          - {stage: holdout, offset: 0, base: 20304001}
          - {stage: holdout, offset: 25, base: 20304001}
          - {stage: holdout, offset: 50, base: 20304001}
          - {stage: holdout, offset: 75, base: 20304001}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Study bounded grazing while moving
        run: |
          mkdir -p path-shards
          node tests/ai1-path-study.js ${{ matrix.offset }} 25 ${{ matrix.base }} normal,baseline,path2,path3,alert,alertPath2,alertPath3 > path-shards/${{ matrix.stage }}-${{ matrix.offset }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: path-${{ matrix.stage }}-${{ matrix.offset }}
          path: path-shards/
          if-no-files-found: error
  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: path-*
          path: path-shards
          merge-multiple: true
      - run: node tests/ai1-path-aggregate.js
      - uses: actions/upload-artifact@v4
        with:
          name: ai1-path-final-result
          path: reports/ai1-path-output/
          if-no-files-found: error
