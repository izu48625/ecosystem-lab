name: Ecosystem validation
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify conservation, feeding and walls
        run: node tests/smoke.test.js
      - name: Verify UI callbacks
        run: node tests/ui-smoke.js
      - name: Quick seeded population regression
        run: node tests/montecarlo.js 5
      - name: Quick green/red balance regression
        run: node tests/predator-balance.js 3
      - name: Sample paired Normal vs AI escape evolution
        run: node tests/escape-comparison.js 4

  mutation_sweep:
    name: Mutation sweep offset ${{ matrix.offset }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        offset: [0, 25, 50, 75]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare 5 mutation settings over 25 matched seeds
        run: node tests/escape-mutation-sweep.js ${{ matrix.offset }} 25 20261217
