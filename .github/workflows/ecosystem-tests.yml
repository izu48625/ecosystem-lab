name: Ecosystem validation
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify conservation, feeding and walls
        run: node tests/smoke.test.js
      - name: Verify UI callbacks
        run: node tests/ui-smoke.js
      - name: Quick seeded population regression
        run: node tests/montecarlo.js 5
      - name: Quick green/red balance regression
        run: node tests/predator-balance.js 3
      - name: Sample paired Normal vs AI escape evolution
        run: node tests/escape-comparison.js 4

  chase_policy_discovery:
    name: Chase policy comparison seed offset ${{ matrix.offset }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        offset: [0, 5, 10, 15, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Six-arm 5-seed chase survival and ecology trial
        run: node tests/chase-improvement-study.js ${{ matrix.offset }} 5 20261117 normal,baseline,clone,early,guard,wide
