name: AI2 100-seed genotype report from preserved validation shards
on:
  push:
    branches:
      - research/ai2-common-garden-genetic-validation-20261119
    paths:
      - '.github/workflows/ai2-genome-v2-reaggregate.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          run-id: 44426385039
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: ai2-calibrated-*
          path: reports/ai2-genome-common-garden-v2-raw/
          merge-multiple: true
      - name: Reaggregate existing 100 independent world results
        run: node tests/ai2-genome-common-garden-aggregate-v2.js
      - uses: actions/upload-artifact@v4
        with:
          name: ai2-calibrated-100-seed-verified-report
          path: reports/ai2-genome-common-garden-v2-results/
          if-no-files-found: error
