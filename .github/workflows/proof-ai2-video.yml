name: Proof of in-house AI2 MP4 simulation recording
on:
  push:
    branches:
      - research/video-capture-proof-20261128
    paths:
      - '.github/workflows/proof-ai2-video.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install visual renderer
        run: |
          python -m pip install pillow
          command -v ffmpeg
      - name: Replay actual AI2 deterministic simulation
        run: node tools/record-ai2-preview.js
      - name: Render 24-second time-compressed HD video
        run: python tools/render-ai2-preview.py
      - name: Verify MP4 media and dimensions
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,duration -of json video-previews/ai2_real_simulation_preview.mp4
          test -s video-previews/ai2_real_simulation_preview.mp4
      - name: Publish MP4 and run metadata as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI2-real-simulation-24-second-HD-MP4
          path: |
            video-previews/ai2_real_simulation_preview.mp4
            video-previews/ai2-source-metadata.json
          if-no-files-found: error
          retention-days: 30
